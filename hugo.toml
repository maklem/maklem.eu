baseURL = "https://maklem.eu/"
locale = 'de'
title = 'maklem.eu'

[module]
    [[module.imports]]
        disable = false
        ignoreConfig = false
        ignoreImports = false
        path = 'github.com/nunocoracao/blowfish/v2'

[menus]
[[menus.main]]
name = "Blog"
pageRef = "blog"
weight = 10

[[menus.main]]
name = "Linktree"
pageRef = "linktree"
weight = 20

[params]
colorScheme = "avocado"
enableSearch = false
homepage.layout = "background"
homepage.showRecent = true
defaultFeaturedImage = "/img/background.jpg"
defaultBackgroundImage = "/img/background.jpg"

[params.header]
layout = "fixed"

[params.list]
showHero = true
heroStyle = "background"

[params.article]
showHero = true
heroStyle = "background"
showAuthorBottom = true

[params.author]
name = "Dr. Marco Klement"
headline = "Projektmitarbeiter FDM @ FAU"
subtitle = "Softwareentwicklung, Serverpflege"
bio = "Projektmitarbeiter Forschungsdatenmanagement @ FAU"
